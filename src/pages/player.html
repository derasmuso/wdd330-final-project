<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | The Stats Sheet</title>
    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.svg">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/player.css" />
    <!-- JavaScript -->
    <script type="module" src="/js/player.js"></script>

</head>

<body>
    <header id="main-header">
        <!-- Header content -->
    </header>

    <main>
        <!-- Page Loading message -->
        <div id="player-status"></div>

        <!-- Player bio -->
        <section class="player-bio">
            <h1 class="player-name">Player Profile</h1>
            <dl class="player-details"></dl>
        </section>

        <!-- Player stats -->
        <section class="player-stats" hidden>
            <div class="stats-header">
                <h2>Season Averages</h2>
                <div class="season-selection">
                    <label for="season-select">Season</label>
                    <select id="season-select"></select>
                </div>
            </div>

            <!-- Stats loading message -->
            <div id="stats-status"></div>

            <div id="stats-table"></div>
        </section>
    </main>

    <footer id="main-footer">
        <!-- Footer content -->
    </footer>

</body>

</html>
