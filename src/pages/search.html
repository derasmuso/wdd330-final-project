<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Search | The Stats Sheet</title>
    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.svg">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/search.css" />
    <!-- JavaScript -->
    <script type="module" src="/js/search.js"></script>

</head>

<body>
    <header id="main-header">
        <!-- Header content -->
    </header>

    <main>
        <!-- Main content -->
        <section class="search-intro">
            <h1>Player Search</h1>
            <p>Search for an NBA player by last name. Select a player to see their stats.</p>
        </section>

        <!-- Search form -->
        <form class="player-form" role="search">
            <label class="label-hidden" for="player-search">Player Search</label>
            <input id="player-search" name="q" type="search" placeholder="Search players" autocomplete="off" />
            <button type="submit">Search</button>
        </form>

        <!-- Loading and error messages -->
        <div id="search-status"></div>

        <!-- Results -->
        <ul id="search-results" class="card-grid"></ul>
    </main>

    <footer id="main-footer">
        <!-- Footer content -->
    </footer>

</body>

</html>
