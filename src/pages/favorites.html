<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites | The Stats Sheet</title>
    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.svg">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/favorites.css" />
    <!-- JavaScript -->
    <script type="module" src="/js/favorites.js"></script>

</head>

<body>
    <header id="main-header">
        <!-- Header content -->
    </header>

    <main>
        <section class="favorites-intro">
            <h1>Favorites</h1>
            <p>Players and teams you've saved. Select one to view it.</p>
        </section>

        <section class="favorites-section">
            <h2>Favorite Players</h2>
            <div id="player-favorites-status"></div>
            <ul id="player-favorites" class="card-grid favorites-grid"></ul>
        </section>

        <section class="favorites-section">
            <h2>Favorite Teams</h2>
            <div id="team-favorites-status"></div>
            <ul id="team-favorites" class="card-grid favorites-grid"></ul>
        </section>
    </main>

    <footer id="main-footer">
        <!-- Footer content -->
    </footer>

</body>

</html>
