<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile | The Stats Sheet</title>
    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.svg">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/team.css" />
    <!-- JavaScript -->
    <script type="module" src="/js/team.js"></script>

</head>

<body>
    <header id="main-header">
        <!-- Header content -->
    </header>

    <main>
        <!-- Team loading message -->
        <div id="team-status"></div>

        <!-- Team information -->
        <section class="team-info">
            <div class="team-heading">
                <img class="team-page-logo" alt="" hidden>
                <h1 class="team-name">Team Profile</h1>
            </div>
            <dl class="team-details"></dl>
        </section>

        <!-- Team roster -->
        <section class="team-roster" hidden>
            <div class="roster-header">
                <h2>Roster</h2>
                <div class="season-selection">
                    <label for="season-select">Season</label>
                    <select id="season-select"></select>
                </div>
            </div>

            <!-- Roster loading message -->
            <div id="roster-status"></div>

            <ul id="roster-list" class="card-grid"></ul>
        </section>
    </main>

    <footer id="main-footer">
        <!-- Footer content -->
    </footer>

</body>

</html>
