<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Directory | The Stats Sheet</title>
    <!-- Favicon -->
    <link rel="icon" href="/images/favicon.svg">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/directory.css" />
    <!-- JavaScript -->
    <script type="module" src="/js/directory.js"></script>

</head>

<body>
    <header id="main-header">
        <!-- Header content -->
    </header>

    <main>
        <!-- Main content -->
        <section class="directory-intro">
            <h1>Team Directory</h1>
            <p>Browse all 30 NBA teams by conference. Select a team to see its roster.</p>
        </section>

        <!-- Loading and error messages -->
        <div id="directory-status"></div>

        <section class="conference">
            <h2>Eastern Conference</h2>
            <ul id="east" class="card-grid"></ul>
        </section>
        <section class="conference">
            <h2>Western Conference</h2>
            <ul id="west" class="card-grid"></ul>
        </section>

        <p class="note">If a team's logo isn't available, The Stats Sheet logo is shown instead.</p>
    </main>

    <footer id="main-footer">
        <!-- Footer content -->
    </footer>

</body>

</html>
